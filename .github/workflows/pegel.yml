name: Daten abholen (Pegel, UV, Pollen, Polarlicht)
on:
  schedule:
    - cron: "7,37 * * * *"   # zweimal pro Stunde
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/pegel.yml"]
permissions:
  contents: write
concurrency: pegel
jobs:
  pegel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/pegel.py
      - run: python scripts/extra.py
        continue-on-error: true
      - name: Archiv-Zweig holen
        run: |
          git config user.name "pegel-bot"
          git config user.email "pegel-bot@users.noreply.github.com"
          if git fetch -q origin daten; then git worktree add -q daten-zweig origin/daten && git -C daten-zweig checkout -q -B daten;
          else git worktree add -q --orphan -b daten daten-zweig; fi
      - name: Archiv fortschreiben
        run: python scripts/archiv.py daten-zweig
        continue-on-error: true
        timeout-minutes: 20
      - name: Archiv speichern
        run: |
          cd daten-zweig
          git add -A
          git diff --cached --quiet || git commit -q -m "Archiv $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          git push -q origin daten
      - name: Speichern
        run: |
          git config user.name "pegel-bot"
          git config user.email "pegel-bot@users.noreply.github.com"
          git add pegel.json extra.json 2>/dev/null || git add pegel.json
          git diff --cached --quiet || git commit -m "Daten $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          git pull --rebase -q && git push
